<div style="min-height: 100vh; background: #000; color: #fff; overflow-x: hidden">

<!-- HEADER (dynamic) -->
<header class="{{navCls}}">
<nav aria-label="Primary" style="padding: 22px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; gap: 20px; flex-wrap: wrap; flex: 1 1 0; min-width: 240px">
<a class="navlink" href="#about">About</a>
<a class="navlink" href="#ai">AI</a>
<a class="navlink" href="#projects">Projects</a>
<a class="navlink" href="#prompting">Prompting</a>
<a class="navlink" href="#learned">Learned</a>
</div>
<a href="#top" class="serif" style="font-size: 34px; text-decoration: none; letter-spacing: -.03em">rence</a>
<div style="display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex: 1 1 0; min-width: 120px">
<a href="https://www.linkedin.com/in/pangilinan-laurence-40a046370/" target="_blank" rel="noopener" class="navlink" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px">LinkedIn</a>
<a href="https://www.instagram.com/r3n._.c3.creates" target="_blank" rel="noopener" class="navlink" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px">Instagram</a>
<a href="mailto:pangilinanlaurence100@gmail.com" aria-label="Email Rence" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></a>
</div>
</nav>
</header>

<!-- HERO -->
<section id="top" style="position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden">
<div class="hero-bg fd" style="position: absolute; inset: 0"></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,.38)"></div>
<div style="position: relative; z-index: 2; padding: 140px 24px 120px; display: flex; flex-direction: column; align-items: center; gap: 28px">
<h1 class="serif fu t1" style="margin: 0; max-width: 920px; text-align: center; font-size: clamp(44px, 6.4vw, 92px); line-height: 1.06; text-shadow: 0 2px 30px rgba(0,0,0,.25)">Rence is an IT student building with code and AI — <a href="#about" class="ulink">Laurence Pangilinan</a>.</h1>
<a href="#projects" class="pill pill-w fu t2">View projects</a>
</div>
</section>

<!-- ABOUT -->
<section id="about">
<div data-rv="about" class="{{cls.about}}" style="display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; padding: 120px 48px">
<h2 class="serif" style="margin: 0; font-size: clamp(40px, 4.6vw, 64px); line-height: 1.05">About me</h2>
<p style="margin: 0; max-width: 480px; font-size: 17px; line-height: 1.75; color: #d4d4d4">I&#39;m a third-year BSIT student interested in technology, design, and coffee. I enjoy building applications, exploring AI tools, experimenting with new ideas, and learning how things work.</p>
<p style="margin: 0; max-width: 480px; font-size: 17px; line-height: 1.75; color: #d4d4d4">Outside of tech, I enjoy coffee brewing and exploring the business side of the craft. I&#39;m interested in creating useful products, improving my skills, and eventually building something of my own.</p>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #bdbdbd; line-height: 1.6">
<span>Laurence R. Pangilinan</span>
<span>BS Information Technology · BSIT-3A</span>
<span>Angeles University Foundation</span>
</div>
</div>
<div class="zoom" style="flex: 1 1 480px; min-width: 0; min-height: 680px; position: relative">
<img class="zi" src="assets/img/rence.png" alt="Portrait of Laurence Pangilinan smiling, wearing a blue shirt" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 40%">
</div>
</div>
</section>

<!-- AI -->
<section id="ai">
<div data-rv="ai" class="{{cls.ai}}" style="max-width: 1280px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 64px">

<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px">
<span style="font-size: 13px; color: #9a9a9a; letter-spacing: .1em">MY AI TOOLKIT</span>
<h2 class="serif" style="margin: 0; font-size: clamp(44px, 6vw, 88px); line-height: 1">Find it. Think it through.<br><span style="font-style: italic">Build it.</span></h2>
<p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.7; color: #bdbdbd">Three assistants, three jobs. Most ideas I work on pass through all of them, in this order.</p>
</div>

<!-- workflow strip -->
<ol aria-label="My AI workflow" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0; border-top: 1px solid #262626; border-bottom: 1px solid #262626">
<sc-for list="{{ais}}" as="a" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 16px; padding: 24px 8px">
<span class="serif" style="font-size: 40px; line-height: 1; color: #6b6b6b">{{a.step}}</span>
<span class="{{a.bg}}" style="width: 12px; height: 12px; border-radius: 999px; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span class="serif" style="font-size: 24px">{{a.verb}}</span><span style="font-size: 13px; color: #9a9a9a; letter-spacing: .06em">WITH {{a.upper}}</span></span>
<sc-if value="{{a.arrow}}" hint-placeholder-val="{{ true }}"><svg width="40" height="12" viewBox="0 0 40 12" fill="none" stroke="#6b6b6b" stroke-width="1" aria-hidden="true" style="margin-left: auto"><path d="M0 6h38M33 1l5 5-5 5"></path></svg></sc-if>
</li>
</sc-for>
</ol>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 40px">
<sc-for list="{{ais}}" as="a" hint-placeholder-count="3">
<article class="ai-card" style="display: flex; flex-direction: column; gap: 24px">
<div class="{{a.bg}}" style="width: 100%; aspect-ratio: 5 / 4; position: relative; overflow: hidden">
<div class="ai-shade"></div>
<span style="position: absolute; left: 18px; top: 16px; font-size: 12px; letter-spacing: .1em; color: rgba(255,255,255,.85)">STEP {{a.step}}</span>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<div style="width: 96px; height: 96px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center">
<sc-if value="{{a.isBuild}}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20 7v10l-8 4.5L4 17V7z"></path><path d="M4 7l8 4.5L20 7M12 11.5v10"></path></svg></sc-if>
<sc-if value="{{a.isFind}}" hint-placeholder-val="{{ true }}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5 13.4 13.4 8.5 15.5 10.6 10.6z"></path><path d="M12 3v1.6M12 19.4V21M3 12h1.6M19.4 12H21"></path></svg></sc-if>
<sc-if value="{{a.isThink}}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2V16h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"></path></svg></sc-if>
</div>
<p class="ai-roles serif" style="margin: 0; max-width: 260px; text-align: center; font-size: 22px; line-height: 1.3; font-style: italic; color: #fff">“{{a.line}}”</p>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h3 class="serif" style="margin: 0; font-size: 44px; line-height: 1">{{a.name}}</h3>
<span style="font-size: 12px; color: #9a9a9a; letter-spacing: .1em">{{a.tag}}</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #bdbdbd">{{a.use}}</p>
<div style="display: flex; flex-direction: column">
<sc-for list="{{a.roles}}" as="r" hint-placeholder-count="3">
<div style="display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid #262626">
<span style="font-size: 12px; color: #6b6b6b; letter-spacing: .08em; padding-top: 4px; width: 20px; flex-shrink: 0">{{r.n}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #fff">{{r.t}}</span><span style="font-size: 14px; line-height: 1.55; color: #9a9a9a">{{r.d}}</span></span>
</div>
</sc-for>
</div>
</article>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-top: 24px">
<p class="serif" style="margin: 0; max-width: 860px; font-size: clamp(28px, 3.2vw, 42px); line-height: 1.25; font-style: italic">“I don&#39;t use AI mainly to look things up. I use it to turn ideas into something real.”</p>
<span style="font-size: 14px; color: #9a9a9a">— Rence</span>
</div>

</div>
</section>
<!-- PROJECTS -->
<section id="projects">
<div data-rv="projHead" class="{{cls.projHead}}" style="padding: 120px 32px 56px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px">
<h2 class="serif" style="margin: 0; font-size: clamp(48px, 6vw, 88px); line-height: 1">Projects</h2>
<p style="margin: 0; max-width: 520px; font-size: 17px; line-height: 1.7; color: #bdbdbd">Ten pieces of work, what I did on each, and what each one taught me.</p>
</div>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="10">
<article data-rv="{{p.key}}" class="{{p.cls}}" style="display: flex; flex-wrap: wrap; flex-direction: {{p.dir}}; align-items: center; gap: 48px; max-width: 1280px; margin: 0 auto; padding: 64px 32px">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px">
<span style="font-size: 13px; color: #9a9a9a; letter-spacing: .08em">PROJECT {{p.num}} · {{p.tech}}</span>
<h3 class="serif" style="margin: 0; font-size: clamp(36px, 4vw, 56px); line-height: 1.05">{{p.title}}</h3>
<p style="margin: 0; max-width: 440px; font-size: 16px; line-height: 1.7; color: #d4d4d4">{{p.desc}}</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 460px; width: 100%; text-align: left">
<div style="border-top: 1px solid #333; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9a9a9a; letter-spacing: .08em">WHAT I DID</span>
<span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">{{p.did}}</span>
</div>
<div style="border-top: 1px solid #333; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9a9a9a; letter-spacing: .08em">RESULTS</span>
<span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">{{p.res}}</span>
</div>
</div>
<p class="serif" style="margin: 0; max-width: 440px; font-size: 24px; line-height: 1.35; font-style: italic; letter-spacing: -.02em">“{{p.lesson}}”</p>
<button type="button" class="pill {{p.pill}}" onClick="{{p.open}}">See my work</button>
</div>
<sc-if value="{{p.isTable}}" hint-placeholder-val="{{ false }}">
<div class="zoom" style="flex: 1 1 520px; min-width: 0; align-self: stretch; display: flex; min-height: 560px">
<div class="bd zi" style="position: relative; overflow: hidden; flex: 1 1 auto; padding: 48px 32px; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<span class="serif" aria-hidden="true" style="position: absolute; right: 24px; top: -0.22em; font-size: 300px; line-height: 1; color: rgba(255,255,255,.07); letter-spacing: -.06em">{{p.num}}</span>
<span style="position: relative; font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.65)">SCORES · OUT OF 5 PER CRITERION</span>
<div role="table" aria-label="AI comparison scores" style="position: relative; background: rgba(0,0,0,.55); border: 1px solid #2a2a2a; border-radius: 16px; padding: 6px 22px; backdrop-filter: blur(6px)">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; padding: 16px 0; border-bottom: 1px solid #2a2a2a">
<span role="columnheader" style="font-size: 12px; color: #9a9a9a; letter-spacing: .1em">CRITERIA</span>
<sc-for list="{{p.table.heads}}" as="h" hint-placeholder-count="3"><span role="columnheader" class="serif" style="font-size: 22px">{{h}}</span></sc-for>
</div>
<sc-for list="{{p.table.rows}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #1c1c1c">
<span role="rowheader" style="font-size: 15px; color: #d4d4d4">{{r.label}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
<span role="cell" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span style="font-size: 16px; min-width: 10px">{{c.v}}</span>
<span aria-hidden="true" style="display: flex; gap: 4px"><sc-for list="{{c.dots}}" as="d" hint-placeholder-count="5"><span style="width: 6px; height: 6px; border-radius: 999px; background: {{d.c}}"></span></sc-for></span>
</span>
</sc-for>
</div>
</sc-for>
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: 12px; align-items: center; padding: 18px 0 12px">
<span role="rowheader" class="serif" style="font-size: 22px">Overall <span style="font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; color: #9a9a9a; letter-spacing: .06em">/ {{p.table.max}}</span></span>
<sc-for list="{{p.table.totals}}" as="t" hint-placeholder-count="3"><span role="cell"><span class="{{t.cls}}">{{t.v}}</span></span></sc-for>
</div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{p.isPairs}}" hint-placeholder-val="{{ false }}">
<div class="zoom" style="flex: 1 1 520px; min-width: 0; align-self: stretch; display: flex; min-height: 560px">
<div class="bd zi" style="position: relative; overflow: hidden; flex: 1 1 auto; padding: 48px 32px; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<span class="serif" aria-hidden="true" style="position: absolute; right: 24px; top: -0.22em; font-size: 300px; line-height: 1; color: rgba(255,255,255,.07); letter-spacing: -.06em">{{p.num}}</span>
<span style="position: relative; font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.65)">{{p.pairsLabel}}</span>
<ul style="position: relative; list-style: none; margin: 0; padding: 6px 22px; background: rgba(0,0,0,.55); border: 1px solid #2a2a2a; border-radius: 16px; backdrop-filter: blur(6px)">
<sc-for list="{{p.pairs}}" as="pr" hint-placeholder-count="6">
<li style="display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 12px; align-items: center; padding: 16px 0; border-bottom: {{pr.border}}">
<span class="serif" style="font-size: 20px; line-height: 1.2">{{pr.c}}</span>
<svg width="24" height="10" viewBox="0 0 24 10" fill="none" stroke="#6b6b6b" stroke-width="1" aria-hidden="true"><path d="M0 5h22M18 1l4 4-4 4"></path></svg>
<span style="font-size: 14px; line-height: 1.5; color: #bdbdbd">{{pr.l}}</span>
</li>
</sc-for>
</ul>
</div>
</div>
</sc-if>
<sc-if value="{{p.isShots}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{p.tiles}}" as="tl" hint-placeholder-count="3">
<button type="button" class="tile zoom" aria-label="{{tl.aria}}" onClick="{{tl.open}}" style="grid-column: {{tl.col}}; aspect-ratio: 4 / 3; position: relative">
<sc-if value="{{tl.backdrop}}" hint-placeholder-val="{{ false }}"><span class="zi bd" style="position: absolute; inset: 0; display: block">
<span class="serif" style="position: absolute; left: 28px; top: -0.18em; font-size: 340px; line-height: 1; color: rgba(255,255,255,.07); letter-spacing: -.06em">{{tl.bigNum}}</span>
<span style="position: absolute; left: 32px; bottom: 26px; font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.6)">{{tl.tagline}}</span>
<span style="position: absolute; left: 7%; right: 7%; top: 50%; transform: translateY(-50%); display: block; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); background: #f2f3f3"><img src="{{tl.src}}" alt="" style="display: block; width: 100%; height: auto"></span>
</span></sc-if>
<sc-if value="{{tl.plain}}" hint-placeholder-val="{{ false }}"><img class="zi" src="{{tl.src}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{tl.pos}}"></sc-if>
<sc-if value="{{tl.none}}" hint-placeholder-val="{{ true }}"><span class="ph zi" style="position: absolute; inset: 0"></span><span style="position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #bdbdbd">{{tl.label}}</span></sc-if>
<span class="tshade"></span>
</button>
</sc-for>
</div>
</sc-if>
</article>
</sc-for>
<div style="height: 80px"></div>
</section>

<!-- PROMPTING -->
<section id="prompting" style="background: #fff; color: #000">
<div data-rv="prompt" class="{{cls.prompt}}" style="max-width: 1280px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 56px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; color: #6b6b6b; letter-spacing: .1em">FROM MY ACTUAL CHATS WITH CLAUDE</span>
<h2 class="serif" style="margin: 0; font-size: clamp(44px, 6vw, 88px); line-height: 1">How my prompting<br><span style="font-style: italic">evolved.</span></h2>
</div>
<p style="margin: 0; max-width: 420px; font-size: 16px; line-height: 1.7; color: #444">From one-line asks to full briefs. Every prompt below is one I really sent, typos and all, along with what it got me.</p>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{prompts}}" as="t" hint-placeholder-count="5">
<article style="display: flex; flex-wrap: wrap; gap: 40px; padding: 40px 0; border-top: 1px solid #e3e3e3">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 16px">
<span class="serif" style="font-size: 56px; line-height: 1; color: #b8b2aa">{{t.num}}</span>
<h3 class="serif" style="margin: 0; font-size: 36px; line-height: 1.05">{{t.name}}</h3>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #444; max-width: 380px">{{t.def}}</p>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
<span style="font-size: 11px; color: #6b6b6b; letter-spacing: .1em">HOW MUCH CONTROL I HAD</span>
<div role="img" aria-label="{{t.levelLabel}}" style="display: flex; gap: 4px">
<sc-for list="{{t.bars}}" as="b" hint-placeholder-count="5"><span style="width: 40px; height: 6px; border-radius: 3px; background: {{b.c}}"></span></sc-for>
</div>
</div>
</div>
<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="font-size: 11px; color: #6b6b6b; letter-spacing: .1em">ME → CLAUDE</span>
<span style="font-size: 12px; color: #000; border: 1px solid #d6d6d6; border-radius: 999px; padding: 4px 12px">{{t.topic}}</span>
</div>
<p style="margin: 0; background: #f2efea; border-radius: 22px 22px 6px 22px; padding: 22px 24px; font-size: 16px; line-height: 1.65; color: #111; white-space: pre-line">{{t.quote}}</p>
<div style="display: flex; gap: 12px; align-items: flex-start">

<!-- LEARNED -->
<section id="learned" style="position: relative; overflow: hidden">
<div class="learn-bg" style="position: absolute; inset: 0"></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,.62)"></div>
<div data-rv="learned" class="{{cls.learned}}" style="position: relative; max-width: 1080px; margin: 0 auto; padding: 160px 32px; display: flex; flex-direction: column; align-items: center; gap: 48px">
<span style="font-size: 13px; color: #d4d4d4; letter-spacing: .1em">WHAT I LEARNED</span>
<p class="serif" style="margin: 0; max-width: 960px; text-align: center; font-size: clamp(32px, 4.2vw, 58px); line-height: 1.15">“AI didn’t replace my thinking. It made me clearer about what I want, and taught me to check what I get back.”</p>
<span style="font-size: 15px; color: #d4d4d4">— Rence</span>
<div style="max-width: 760px; display: flex; flex-direction: column; gap: 22px; text-align: left">
<p style="margin: 0; font-size: 17px; line-height: 1.85; color: #ececec">Ten projects ago, I prompted the way most people search: a few words and a hope. Building a finance app for my own phone, testing three AI systems side by side, escaping vaults on a token budget and designing a chatbot for a real bakery changed that. The biggest shift wasn’t memorizing frameworks like RTCFC or COSTAR. It was learning to write down what I actually want: who it’s for, what it must include, what it must never do, and when to stop and check with me.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.85; color: #ececec">The second shift was about trust. Every lab showed the same lesson in a different way: a confident answer can still be wrong. A friendly analogy blended two kinds of machine learning, a perfect-looking citation was missing eleven of its authors, and my own study agent failed a test until I fixed its rules. That’s why the systems I’m proudest of share the same shape: the AI does the talking, while rules, verification and a human make the final call.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.85; color: #ececec">Going forward, I’ll keep using each tool for what it does best: Gemini to find, ChatGPT to think things through, and Claude to build. And I’ll keep doing the part no AI can do for me: deciding what’s right, and checking that it is.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 32px; width: 100%; margin-top: 16px">
<div style="border-top: 1px solid rgba(255,255,255,.4); padding-top: 18px; display: flex; flex-direction: column; gap: 10px"><span class="serif" style="font-size: 40px; line-height: 1; color: #F08A3C">01</span><span class="serif" style="font-size: 24px; line-height: 1.2">Clarity is the skill</span><span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">The more specific the brief, the less the AI has to guess.</span></div>
<div style="border-top: 1px solid rgba(255,255,255,.4); padding-top: 18px; display: flex; flex-direction: column; gap: 10px"><span class="serif" style="font-size: 40px; line-height: 1; color: #F08A3C">02</span><span class="serif" style="font-size: 24px; line-height: 1.2">Confident isn’t correct</span><span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">Facts, citations and numbers get verified before I rely on them.</span></div>
<div style="border-top: 1px solid rgba(255,255,255,.4); padding-top: 18px; display: flex; flex-direction: column; gap: 10px"><span class="serif" style="font-size: 40px; line-height: 1; color: #F08A3C">03</span><span class="serif" style="font-size: 24px; line-height: 1.2">Guardrails make it useful</span><span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">Approval steps, rules and fallbacks turn a demo into something people can rely on.</span></div>
<div style="border-top: 1px solid rgba(255,255,255,.4); padding-top: 18px; display: flex; flex-direction: column; gap: 10px"><span class="serif" style="font-size: 40px; line-height: 1; color: #F08A3C">04</span><span class="serif" style="font-size: 24px; line-height: 1.2">Humans stay in the loop</span><span style="font-size: 15px; line-height: 1.6; color: #d4d4d4">AI can organize, draft and suggest. The decision is still mine.</span></div>
</div>
</div>

<template id="tpl-modal">
<sc-if value="{{gal.open}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{gal.label}}" style="position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px">
<button type="button" class="backdrop-in" aria-label="Close gallery" onClick="{{gal.close}}" style="position: absolute; inset: 0; border: 0; background: rgba(0,0,0,.82); backdrop-filter: blur(6px)"></button>
<div class="modal-in" style="position: relative; width: 100%; max-width: 1040px; background: #0d0d0d; border: 1px solid #262626; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9a9a9a; letter-spacing: .08em">PROJECT {{gal.num}} · {{gal.count}}</span>
<span class="serif" style="font-size: 30px; line-height: 1.1">{{gal.title}}</span>
</div>
<button type="button" class="icon-btn" aria-label="Close gallery" onClick="{{gal.close}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<sc-if value="{{gal.isText}}" hint-placeholder-val="{{ false }}">
<div class="cap-0" style="max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 8px">
<sc-for list="{{gal.sections}}" as="sec" hint-placeholder-count="3">
<section style="border-top: 1px solid #262626; padding: 24px 0 8px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; color: #9a9a9a; letter-spacing: .1em">{{sec.label}}</span>
<sc-if value="{{sec.hasTitle}}" hint-placeholder-val="{{ false }}"><h3 class="serif" style="margin: 0; font-size: 32px; line-height: 1.15">{{sec.title}}</h3></sc-if>
<sc-if value="{{sec.hasIntro}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #9a9a9a">{{sec.intro}}</p></sc-if>
<sc-if value="{{sec.hasList}}" hint-placeholder-val="{{ false }}"><ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.6; color: #d4d4d4"><sc-for list="{{sec.list}}" as="li" hint-placeholder-count="3"><li>{{li}}</li></sc-for></ol></sc-if>
<sc-for list="{{sec.shots}}" as="sh" hint-placeholder-count="0">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{sh.tags}}" as="tg" hint-placeholder-count="2"><span class="{{tg.cls}}">{{tg.t}}</span></sc-for></div>
<img src="{{sh.src}}" alt="{{sh.cap}}" loading="lazy" style="display: block; max-width: 100%; height: auto; align-self: flex-start; border: 1px solid #262626; border-radius: 10px; background: #000">
<figcaption style="font-size: 13px; color: #9a9a9a">{{sh.cap}}</figcaption>
</figure>
</sc-for>
<sc-if value="{{sec.hasTable}}" hint-placeholder-val="{{ false }}">
<div style="overflow-x: auto; border: 1px solid #262626; border-radius: 14px">
<div role="table" aria-label="{{sec.label}}" style="min-width: 640px; padding: 4px 20px">
<div role="row" style="display: grid; grid-template-columns: {{sec.cols}}; gap: 16px; padding: 14px 0; border-bottom: 1px solid #2a2a2a">
<sc-for list="{{sec.heads}}" as="h" hint-placeholder-count="4"><span role="columnheader" class="{{h.cls}}">{{h.t}}</span></sc-for>
</div>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: {{sec.cols}}; gap: 16px; padding: 14px 0; border-bottom: {{r.border}}">
<span role="rowheader" style="font-size: 14px; color: #fff; line-height: 1.5">{{r.label}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3"><span role="cell" style="display: flex; flex-direction: column; gap: 4px"><span class="{{c.cls}}">{{c.v}}</span><sc-if value="{{c.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; line-height: 1.55; color: #9a9a9a">{{c.note}}</span></sc-if></span></sc-for>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-for list="{{sec.qa}}" as="q" hint-placeholder-count="0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 10px">
<h4 class="serif" style="margin: 0; font-size: 24px; line-height: 1.25">{{q.q}}</h4>
<sc-if value="{{q.hasShot}}" hint-placeholder-val="{{ false }}">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{q.shot.tags}}" as="tg" hint-placeholder-count="2"><span class="{{tg.cls}}">{{tg.t}}</span></sc-for></div>
<img src="{{q.shot.src}}" alt="{{q.shot.cap}}" loading="lazy" style="display: block; max-width: 100%; height: auto; align-self: flex-start; border: 1px solid #262626; border-radius: 10px; background: #000">
<figcaption style="font-size: 13px; color: #9a9a9a">{{q.shot.cap}}</figcaption>
</figure>
</sc-if>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #d4d4d4">{{q.a}}</p>
</div>
</sc-for>
<sc-for list="{{sec.paras}}" as="para" hint-placeholder-count="0"><p style="margin: 0; font-size: 16px; line-height: 1.85; color: #d4d4d4">{{para}}</p></sc-for>
</section>
</sc-for>
</div>
</sc-if>
<sc-if value="{{gal.isImg}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; background: #050505; overflow: hidden">
<sc-if value="{{gal.has}}" hint-placeholder-val="{{ false }}"><img class="{{gal.anim}}" src="{{gal.src}}" alt="{{gal.cap}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain"></sc-if>
<sc-if value="{{gal.none}}" hint-placeholder-val="{{ true }}"><span class="ph {{gal.anim}}" style="position: absolute; inset: 0"></span><span class="{{gal.capAnim}}" style="position: relative; font-size: 14px; color: #bdbdbd">{{gal.cap}}</span></sc-if>
<sc-if value="{{gal.multi}}" hint-placeholder-val="{{ true }}">
<button type="button" class="icon-btn" aria-label="Previous image" onClick="{{gal.prev}}" style="position: absolute; left: 16px; top: 50%; margin-top: -24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" class="icon-btn" aria-label="Next image" onClick="{{gal.next}}" style="position: absolute; right: 16px; top: 50%; margin-top: -24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</sc-if>
</div>
<p class="{{gal.capAnim}}" style="margin: 0; font-size: 14px; color: #bdbdbd">{{gal.cap}}</p>
<sc-if value="{{gal.multi}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{gal.thumbs}}" as="th" hint-placeholder-count="3">
<button type="button" class="{{th.cls}}" aria-label="{{th.label}}" onClick="{{th.pick}}" style="aspect-ratio: 16 / 10; position: relative">
<sc-if value="{{th.has}}" hint-placeholder-val="{{ false }}"><img src="{{th.src}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top"></sc-if>
<sc-if value="{{th.none}}" hint-placeholder-val="{{ true }}"><span class="ph" style="position: absolute; inset: 0"></span></sc-if>
<span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 8px; background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0)); font-size: 11px; color: #fff; text-align: left">{{th.short}}</span>
</button>
</sc-for>
</div>
</sc-if>
</sc-if>
</div>
</div>
